name: Desplegar Brainer Sync (Cloudflare Worker)

# Se ejecuta a mano (Actions → Run workflow). Requiere los secretos
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y BRAINER_SECRET en el repositorio.
# El primer despliegue se hizo directamente con wrangler.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar Worker y guardar la frase secreta
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            BRAINER_SECRET
        env:
          BRAINER_SECRET: ${{ secrets.BRAINER_SECRET }}
