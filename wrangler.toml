# Publica la ventana de Brainer (carpeta app/) como sitio estático en Cloudflare Workers.
#   npx wrangler deploy        → https://brainer.<tu-cuenta>.workers.dev
name = "brainer"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "app"
not_found_handling = "single-page-application"
